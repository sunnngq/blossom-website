<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой сайт</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            Sakura

        <nav class="navigation">
            <a href="#">Главная</a>
            <a href="#">О нас</a>
            <a href="#">Меню</a>

        </nav>

        <button class="header-button">
            Забронировать

    <main>

        <section class="hero">

                <p class="hero-small-text">
                    Добро пожаловать
                </p>

                <h1>
                    Добро пожаловать в Sakura

                <p class="hero-description">
                    Уютное место для приятных встреч,

                </p>

                <button class="hero-button">
                    Посмотреть меню
                </button>

            </div>

        </section>




        <section class="nastya-section">

            <h2>
                Наша история
            </h2>

            <p>
                Здесь будет нижняя часть сайта.
            </p>

        </section>

    </main>


    <footer class="footer">

        <p>
            © 2026 Sakura
        </p>

    </footer>

</html>
